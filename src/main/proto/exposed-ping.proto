syntax = "proto3";

option java_multiple_files = true;
option java_package = "org.charitable.app.proto";
option java_outer_classname = "PingProto";

service PingService {
  rpc Ping (PingRequest) returns (PingReply);
}

message PingRequest {}

message PingReply {
  string message = 1;
  string timestamp = 2;
}
