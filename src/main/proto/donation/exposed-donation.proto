syntax = "proto3";

option java_multiple_files = true;
option java_package = "org.charitable.app.proto";
option java_outer_classname = "DonationProto";

import "exposed-common.proto";

service DonationService {
  rpc Donate(UserDonationRequest) returns (CommonResponse);

}

message UserDonationRequest {
  string title = 1;
  string description = 2;
  DonationType type = 3;
}
