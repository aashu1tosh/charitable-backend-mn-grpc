micronaut.application.name=charitable-backend

// environment -> development, production, test
micronaut.application.env=developement

#context path
micronaut.server.context-path=/api/v1

# server-reflection
grpc.server.reflection.enabled=true

# Database Configuration
datasources.default.url=jdbc:postgresql://localhost:5432/charitable
datasources.default.dialect=POSTGRES
datasources.default.driver-class-name=org.postgresql.Driver
datasources.default.username=postgres
datasources.default.password=root

# Enable JPA\
jpa.default.properties.hibernate.hbm2ddl.auto=update
jpa.default.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

