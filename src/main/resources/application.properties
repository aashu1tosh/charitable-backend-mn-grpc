micronaut.application.name=charitable-backend


# Ensure pool initializes eagerly
datasources.default.eager-init=true

# Validate connection at startup
datasources.default.validation-query=SELECT 1
datasources.default.test-on-connect=true

# Database Configuration
datasources.default.url=jdbc:postgresql://localhost:5432/your_database_name
datasources.default.username=your_username
datasources.default.password=your_password
datasources.default.driver-class-name=org.postgresql.Driver
